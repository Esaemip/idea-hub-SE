<div id="app"></div>
<script>
/* 아이디어 허브 · 화면 시안 (feature/board-ui). 화면 구조는 render() 안의 템플릿, 동작은 Page 클래스에 있어요. */
const { html, render, Component } = window.htmPreact;

class DCLogic extends Component {
  componentDidMount() { this.flushFocus(); }
  componentDidUpdate() { this.flushFocus(); }
  flushFocus() {
    const go = this.pendingFocus;
    this.pendingFocus = null;
    if (go) go();
  }
  render() {
    const V = this.renderVals();
    return html`<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FAFAF7; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; color: #111118; font-size: 14px">

  <aside aria-label="메뉴" style="flex: 1 1 248px; box-sizing: border-box; padding: 14px 10px 12px; background: #F7F7F8; border-right: 1px solid #ECECEF; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 6px 14px">
      <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#111118"></rect><g stroke="#55586A" stroke-width="1.3" stroke-linecap="round"><line x1="14" y1="14" x2="14" y2="5.5"></line><line x1="14" y1="14" x2="22.1" y2="11.4"></line><line x1="14" y1="14" x2="19" y2="20.9"></line><line x1="14" y1="14" x2="9" y2="20.9"></line><line x1="14" y1="14" x2="5.9" y2="11.4"></line></g><circle cx="14" cy="5.5" r="2.3" fill="#5B8DF5"></circle><circle cx="22.1" cy="11.4" r="2.3" fill="#F28A45"></circle><circle cx="19" cy="20.9" r="2.3" fill="#A974E8"></circle><circle cx="9" cy="20.9" r="2.3" fill="#2DB88A"></circle><circle cx="5.9" cy="11.4" r="2.3" fill="#E9608F"></circle><circle cx="14" cy="14" r="3.3" fill="#FFFFFF"></circle></svg>
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.2px">Idea hub</span>
    </div>
    <nav aria-label="보드 메뉴" style="display: flex; flex-direction: column; gap: 2px">
      <button type="button" onClick="${V.openNew}" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; color: #111118; font: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer">

          <span style="width: 48px; height: 48px; border-radius: 24px; background: #FDECEF; color: #C4314B; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path><path d="M10 11v5M14 11v5"></path></svg></span>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <h2 id="dlg-del-title" style="margin: 0; font-size: 20px; font-weight: 700">‘${V.dl.target}’ 보드를 지울까요?</h2>
            <p id="dlg-del-desc" style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A4D57">보드 안의 메모 ${V.dl.memos}개와 분류 결과가 함께 지워져요. 지운 보드는 되돌릴 수 없어요.</p>
          </div>
          <div style="display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px">
            <button type="button" ref="${V.cancelRef}" onClick="${V.close}" style="height: 44px; padding: 0 18px; border: 1.5px solid #DCDCE2; border-radius: 12px; background: #FFFFFF; color: #111118; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">취소</button>
            <button type="button" onClick="${V.confirmDelete}" style="height: 44px; padding: 0 18px; border: none; border-radius: 12px; background: #C4314B; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">지우기</button>
          </div>
        </div>
      ` : null}

    </div>
  ` : null}

  ${V.toastShow ? html`
    <div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 22px; background: #111118; color: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 12px 32px rgba(17,17,24,0.25); animation: ihPop 0.2s ease">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7BE0B3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>${V.toastText}
    </div>
  ` : null}
</div>`;
  }
}

const SEED = [
  { id: 'b1', title: '아이디어 허브', memos: 24, groups: 6, fresh: 0, classified: true, when: '방금 전', colors: ['#D6E5FF', '#FFDFC6', '#CDEFDD'] },
  { id: 'b2', title: '웹페이지', memos: 9, groups: 0, fresh: 9, classified: false, when: '어제', colors: ['#FFEF96', '#FFEF96', '#FFEF96'] },
  { id: 'b3', title: '발표 준비', memos: 12, groups: 3, fresh: 2, classified: true, when: '11월 20일', colors: ['#EADCFF', '#FFD8E5', '#FFEF96'] },
  { id: 'b4', title: '소프트웨어 공학 3주차 과제', memos: 5, groups: 2, fresh: 0, classified: true, when: '11월 16일', colors: ['#CDEFDD', '#D6E5FF', '#E9E9EC'] }
];
const TILT = [-4, 3, -2];
const MAX = 40;
function chipOf(b) {
  if (!b.memos) return { chip: '빈 보드', chipBg: '#F0F0F3', chipFg: '#4A4D57' };
  if (!b.classified) return { chip: '분류 전', chipBg: '#F0F0F3', chipFg: '#4A4D57' };
  if (b.fresh) return { chip: '새 메모 ' + b.fresh + '개', chipBg: '#FFF1CC', chipFg: '#6E4600' };
  return { chip: '분류 완료', chipBg: '#E3F5EC', chipFg: '#0E6B4B' };
}
class Page extends DCLogic {
  constructor(props) {
    super(props);
    const st = props.start || '목록';
    const boards = st === '빈 목록' ? [] : SEED.map((b) => Object.assign({}, b));
    let modal = null;
    if (st === '새 보드') modal = { kind: 'new', id: null, draft: '2차 회의 아이디어', tried: false };
    if (st === '이름 바꾸기') modal = { kind: 'rename', id: 'b2', draft: '웹페이지 개편 아이디어', tried: false };
    if (st === '삭제 확인') modal = { kind: 'delete', id: 'b2', draft: '', tried: false };
    this.state = {
      boards: boards,
      status: st === '불러오는 중' ? 'loading' : st === '목록 오류' ? 'error' : 'ok',
      q: '',
      menuFor: null,
      acct: false,
      modal: modal,
      toast: ''
    };
    this.timer = null;
    this.toastTimer = null;
    this.focusedModal = null;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
    if (this.toastTimer) clearTimeout(this.toastTimer);
  }
  say(text) {
    if (this.toastTimer) clearTimeout(this.toastTimer);
    this.setState({ toast: text });
    this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2600);
  }
  open(kind, id) {
    const b = this.state.boards.find((x) => x.id === id);
    this.focusedModal = null;
    this.setState({ modal: { kind: kind, id: id || null, draft: kind === 'rename' && b ? b.title : '', tried: false }, menuFor: null, acct: false });
  }
  renderVals() {
    const s = this.state;
    const q = s.q.trim();
    const list = q ? s.boards.filter((b) => b.title.indexOf(q) >= 0) : s.boards;
    const ok = s.status === 'ok';
    const m = s.modal;
    const target = m && m.id ? s.boards.find((b) => b.id === m.id) : null;
    const draft = m ? m.draft : '';
    const nameErr = draft.trim() ? '' : '보드 이름을 적어 주세요.';
    const showErr = m && m.tried ? nameErr : '';
    const cards = list.map((b) => {
      const open = s.menuFor === b.id;
      const notes = b.memos ? b.colors.map((c, i) => ({ c: c, r: TILT[i % 3] })) : [];
      return Object.assign({
        title: b.title,
        meta: b.memos ? '메모 ' + b.memos + '개' + (b.groups ? ' · 주제 ' + b.groups + '개' : '') : '메모 0개',
        when: b.when,
        notes: notes,
        blank: !b.memos,
        zi: open ? 3 : 1,
        menuOpen: open,
        menuAttr: open ? 'true' : 'false',
        menuBg: open ? '#F0F0F3' : 'transparent',
        menuLabel: '‘' + b.title + '’ 보드 메뉴',
        toggleMenu: () => this.setState({ menuFor: this.state.menuFor === b.id ? null : b.id, acct: false }),
        rename: () => this.open('rename', b.id),
        del: () => this.open('delete', b.id)
      }, chipOf(b));
    });
    return {
      countLabel: ok ? s.boards.length + '개' : '',
      q: s.q,
      typeQ: (e) => this.setState({ q: e.target.value, menuFor: null }),
      searchRef: (el) => { this.searchEl = el; },
      focusSearch: () => { if (this.searchEl) this.searchEl.focus(); },
      recent: s.boards.slice(0, 3).map((b) => ({ title: b.title })),
      acctOpen: s.acct,
      acctAttr: s.acct ? 'true' : 'false',
      toggleAcct: () => this.setState({ acct: !this.state.acct, menuFor: null }),
      openNew: () => this.open('new', null),
      isLoading: s.status === 'loading',
      skeletons: [1, 2, 3, 4],
      isError: s.status === 'error',
      retry: () => {
        this.setState({ status: 'loading' });
        if (this.timer) clearTimeout(this.timer);
        this.timer = setTimeout(() => this.setState({ status: 'ok' }), 900);
      },
      isEmpty: ok && !s.boards.length,
      noMatch: ok && !!s.boards.length && !list.length,
      hasList: ok && !!list.length,
      cards: cards,
      modalOpen: !!m,
      isNew: !!m && m.kind === 'new',
      isRename: !!m && m.kind === 'rename' && !!target,
      isDelete: !!m && m.kind === 'delete' && !!target,
      dl: {
        draft: draft,
        count: draft.length + '/' + MAX,
        msg: showErr,
        has: !!showErr,
        bd: showErr ? '#C4314B' : '#DCDCE2',
        inv: showErr ? 'true' : 'false',
        target: target ? target.title : '',
        memos: target ? target.memos : 0
      },
      modalRef: (el) => {
        const key = m ? m.kind + (m.id || '') : null;
        if (el && key && this.focusedModal !== key) {
          this.focusedModal = key;
          el.focus();
          const n = el.value.length;
          try { el.setSelectionRange(n, n); } catch (err) {}
        }
      },
      cancelRef: (el) => {
        const key = m ? m.kind + (m.id || '') : null;
        if (el && key && this.focusedModal !== key) {
          this.focusedModal = key;
          el.focus();
        }
      },
      typeDraft: (e) => this.setState({ modal: Object.assign({}, this.state.modal, { draft: e.target.value.slice(0, MAX) }) }),
      close: () => this.setState({ modal: null }),
      dialogKey: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.setState({ modal: null }); }
        else if (e.key === 'Enter' && this.state.modal && this.state.modal.kind === 'rename') {
          const isComposing = (e.nativeEvent || e).isComposing || e.keyCode === 229;
          if (!isComposing) { e.preventDefault(); this.saveRename(); }
        }
      },
      createHref: nameErr ? '#dlg-new-name' : 'index.html',
      create: (e) => {
        if (nameErr) {
          if (e && e.preventDefault) e.preventDefault();
          this.setState({ modal: Object.assign({}, this.state.modal, { tried: true }) });
        }
      },
      saveRename: () => this.saveRename(),
      confirmDelete: () => {
        const cur = this.state.modal;
        const b = cur ? this.state.boards.find((x) => x.id === cur.id) : null;
        if (!b) return;
        this.setState({ boards: this.state.boards.filter((x) => x.id !== b.id), modal: null });
        this.say('‘' + b.title + '’ 보드를 지웠어요');
      },
      toastShow: !!s.toast,
      toastText: s.toast
    };
  }
  saveRename() {
    const cur = this.state.modal;
    if (!cur) return;
    const name = cur.draft.trim();
    if (!name) { this.setState({ modal: Object.assign({}, cur, { tried: true }) }); return; }
    this.setState({ boards: this.state.boards.map((b) => b.id === cur.id ? Object.assign({}, b, { title: name, when: '방금 전' }) : b), modal: null });
    this.say('보드 이름을 바꿨어요');
  }
}

const URL_START = {'empty': '빈 목록', 'new': '새 보드', 'rename': '이름 바꾸기', 'delete': '삭제 확인', 'loading': '불러오는 중', 'error': '목록 오류'};
const key = new URLSearchParams(location.search).get('state');
render(html`<${Page} start=${URL_START[key] || '목록'} />`, document.getElementById('app'));
</script>
</body>
</html>
