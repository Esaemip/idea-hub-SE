<div id="app"></div>
<script>
/* 아이디어 허브 · 화면 시안 (feature/board-ui). 화면 구조는 render() 안의 템플릿, 동작은 Page 클래스에 있어요. */
const { html, render, Component } = window.htmPreact;

class DCLogic extends Component {
  componentDidMount() { this.flushFocus(); }
  componentDidUpdate() { this.flushFocus(); }
  flushFocus() {
    const go = this.pendingFocus;
    this.pendingFocus = null;
    if (go) go();
  }
  render() {
    const V = this.renderVals();
    return html`<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FFFFFF; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; color: #111118">

  <section aria-label="아이디어 허브 소개" style="flex: 1 1 520px; min-width: 0; position: relative; overflow: hidden; box-sizing: border-box; padding: 40px 56px 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; background-color: #FAFAF7; background-image: linear-gradient(#EFEFEA 1px, transparent 1px), linear-gradient(90deg, #EFEFEA 1px, transparent 1px); background-size: 28px 28px; border-right: 1px solid #ECECEF">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#111118"></rect><g stroke="#55586A" stroke-width="1.3" stroke-linecap="round"><line x1="14" y1="14" x2="14" y2="5.5"></line><line x1="14" y1="14" x2="22.1" y2="11.4"></line><line x1="14" y1="14" x2="19" y2="20.9"></line><line x1="14" y1="14" x2="9" y2="20.9"></line><line x1="14" y1="14" x2="5.9" y2="11.4"></line></g><circle cx="14" cy="5.5" r="2.3" fill="#5B8DF5"></circle><circle cx="22.1" cy="11.4" r="2.3" fill="#F28A45"></circle><circle cx="19" cy="20.9" r="2.3" fill="#A974E8"></circle><circle cx="9" cy="20.9" r="2.3" fill="#2DB88A"></circle><circle cx="5.9" cy="11.4" r="2.3" fill="#E9608F"></circle><circle cx="14" cy="14" r="3.3" fill="#FFFFFF"></circle></svg>
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.2px">Idea hub</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 36px">
      <div style="display: flex; flex-direction: column; gap: 14px">

              <div style="position: relative">
                <input id="rc-pw" type="${V.pwType}" autocomplete="new-password" value="${V.f.pw}" onInput="${V.setPw}" aria-invalid="${V.sp.inv}" style="width: 100%; box-sizing: border-box; height: 46px; padding: 0 52px 0 14px; border: 1.5px solid ${V.sp.bd}; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px; color: #111118" />
                <button type="button" onClick="${V.togglePw}" aria-label="${V.pwLabel}" aria-pressed="${V.pwShown}" style="position: absolute; right: 3px; top: 3px; width: 40px; height: 40px; border: none; border-radius: 8px; background: transparent; color: #5C5F6A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
              <div style="display: flex; gap: 14px; flex-wrap: wrap">
                ${(V.checks).map((c, i) => html`
                  <span key=${c._k || i} style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: ${c.fw}; color: ${c.color}">
                    ${c.ok ? html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>` : null}
                    ${c.no ? html`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle></svg>` : null}
                    ${c.label}
                  </span>
                `)}
              </div>
              ${V.sp.has ? html`<span style="font-size: 13px; color: #C4314B">${V.sp.msg}</span>` : null}
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="rc-pw2" style="font-size: 13px; font-weight: 600; color: #3C3F4A">새 비밀번호 확인</label>
              <input id="rc-pw2" type="${V.pwType}" autocomplete="new-password" value="${V.f.pw2}" onInput="${V.setPw2}" aria-invalid="${V.sp2.inv}" style="width: 100%; box-sizing: border-box; height: 46px; padding: 0 14px; border: 1.5px solid ${V.sp2.bd}; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 15px; color: #111118" />
              ${V.sp2.has ? html`<span style="font-size: 13px; color: #C4314B">${V.sp2.msg}</span>` : null}
            </div>
          </div>
          <button type="button" onClick="${V.recover}" style="height: 50px; border: none; border-radius: 12px; background: #111118; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">비밀번호 바꾸기</button>
        </div>
      ` : null}

    </div>
  </main>
</div>`;
  }
}

const SIGNUP_CODE = 'K7QM-2XPA-9DRT';
const NEXT_CODE = 'W4NB-8HZE-3LUC';
const START = {
  '로그인': { screen: 'login' },
  '로그인 오류': { screen: 'login', email: 'jaehwan@example.com', pw: 'ideahub1', loginErr: true },
  '회원가입': { screen: 'signup', name: '이재환', email: 'leejh@example.com', pw: 'ideahub2', pw2: 'ideahub', tried: true },
  '복구 코드': { screen: 'code', codeFor: 'signup', code: SIGNUP_CODE, email: 'leejh@example.com' },
  '비밀번호 재설정': { screen: 'recover', email: 'jaehwan@example.com', codeIn: SIGNUP_CODE },
  '로그인 만료': { screen: 'login', email: 'jaehwan@example.com', expired: true }
};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const CODE_RE = /^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
const TAKEN = 'jaehwan@example.com';
const RED = '#C4314B';
const LINE = '#DCDCE2';
function pwChecks(pw) {
  return [
    { label: '8자 이상', ok: pw.length >= 8 },
    { label: '영문 포함', ok: /[A-Za-z]/.test(pw) },
    { label: '숫자 포함', ok: /[0-9]/.test(pw) }
  ];
}
function field(msg) {
  return { msg: msg, has: !!msg, bd: msg ? RED : LINE, inv: msg ? 'true' : 'false' };
}
class Page extends DCLogic {
  constructor(props) {
    super(props);
    const s = START[props.start] || START['로그인'];
    this.state = Object.assign({ screen: 'login', name: '', email: '', pw: '', pw2: '', codeIn: '', code: '', codeFor: 'signup', saved: false, copied: false, agree: false, remember: true, showPw: false, tried: false, loginErr: false, recoverErr: false, taken: false, expired: false }, s);
  }
  go(screen, extra) {
    this.setState(Object.assign({ screen: screen, pw: '', pw2: '', showPw: false, tried: false, loginErr: false, recoverErr: false, taken: false, saved: false, copied: false }, extra || {}));
  }
  renderVals() {
    const s = this.state;
    const set = (k) => (e) => {
      const p = { loginErr: false, recoverErr: false };
      p[k] = k === 'codeIn' ? e.target.value.toUpperCase().slice(0, 14) : e.target.value;
      if (k === 'email') p.taken = false;
      this.setState(p);
    };
    const show = (msg) => (s.tried ? msg : '');
    const email = s.email.trim();
    const emailErr = !email ? '이메일을 적어 주세요.' : !EMAIL_RE.test(email) ? '이메일 형식이 맞지 않아요. 예: name@example.com' : '';
    const takenErr = s.taken ? '이미 가입된 이메일이에요. 로그인해 주세요.' : '';
    const checks = pwChecks(s.pw);
    const pwOk = checks.every((c) => c.ok);
    const nameErr = s.name.trim() ? '' : '이름을 적어 주세요.';
    const loginPwErr = s.pw ? '' : '비밀번호를 적어 주세요.';
    const newPwErr = !s.pw ? '비밀번호를 적어 주세요.' : pwOk ? '' : '위 조건을 모두 채워 주세요.';
    const pw2Err = !s.pw2 ? '비밀번호를 한 번 더 적어 주세요.' : s.pw2 !== s.pw ? '비밀번호가 서로 달라요.' : '';
    const agreeErr = s.agree ? '' : '약관에 동의해야 가입할 수 있어요.';
    const codeErr = !s.codeIn.trim() ? '복구 코드를 적어 주세요.' : !CODE_RE.test(s.codeIn.trim()) ? '복구 코드는 XXXX-XXXX-XXXX 모양이에요.' : '';
    const savedErr = s.saved ? '' : '코드를 적어 뒀는지 체크해 주세요.';

    const le = field(show(emailErr));
    const lp = field(show(loginPwErr));
    if (s.loginErr) { le.bd = RED; lp.bd = RED; }
    const rk = field(show(codeErr));
    if (s.recoverErr) rk.bd = RED;
    const loginOk = !emailErr && !loginPwErr;
    const forSignup = s.codeFor === 'signup';

    return {
      isLogin: s.screen === 'login',
      isSignup: s.screen === 'signup',
      isCode: s.screen === 'code',
      isRecover: s.screen === 'recover',
      f: { name: s.name, email: s.email, pw: s.pw, pw2: s.pw2, codeIn: s.codeIn, agree: s.agree, remember: s.remember, saved: s.saved },
      setName: set('name'),
      setEmail: set('email'),
      setPw: set('pw'),
      setPw2: set('pw2'),
      setCode: set('codeIn'),
      toggleAgree: (e) => this.setState({ agree: e.target.checked }),
      toggleRemember: (e) => this.setState({ remember: e.target.checked }),
      toggleSaved: (e) => this.setState({ saved: e.target.checked }),
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      pwType: s.showPw ? 'text' : 'password',
      pwLabel: s.showPw ? '비밀번호 숨기기' : '비밀번호 보기',
      pwShown: s.showPw ? 'true' : 'false',
      le: le,
      lp: lp,
      sn: field(show(nameErr)),
      se: field(show(emailErr || takenErr)),
      sp: field(show(newPwErr)),
      sp2: field(show(pw2Err)),
      ag: field(show(agreeErr)),
      re: field(show(emailErr)),
      rk: rk,
      sv: field(show(savedErr)),
      checks: checks.map((c) => ({ label: c.label, ok: c.ok, no: !c.ok, color: c.ok ? '#0E7A55' : '#6B6E79', fw: c.ok ? 700 : 500 })),
      expired: s.expired,
      loginErr: s.loginErr,
      recoverErr: s.recoverErr,
      loginHref: loginOk ? (s.expired ? 'index.html' : 'boards.html') : '#auth-form',
      login: (e) => {
        if (!loginOk) {
          if (e && e.preventDefault) e.preventDefault();
          this.setState({ tried: true, loginErr: false });
        }
      },
      signup: () => {
        if (nameErr || emailErr || newPwErr || pw2Err || agreeErr) { this.setState({ tried: true }); return; }
        if (email.toLowerCase() === TAKEN) { this.setState({ tried: true, taken: true }); return; }
        this.go('code', { codeFor: 'signup', code: SIGNUP_CODE });
      },
      code: s.code,
      codeTitle: forSignup ? '복구 코드를 저장해 주세요' : '비밀번호를 바꿨어요',
      codeLead: forSignup ? '비밀번호를 잊었을 때 이 코드로 새 비밀번호를 정할 수 있어요. 메일 인증을 쓰지 않아서, 이 코드가 없으면 비밀번호를 되찾을 수 없어요.' : '방금 쓴 복구 코드는 이제 못 써요. 아래 새 복구 코드를 다시 적어 두고 새 비밀번호로 로그인해 주세요.',
      codeNext: forSignup ? '보드로 가기' : '로그인하러 가기',
      copyLabel: s.copied ? '복사했어요' : '복사',
      copyCode: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText(this.state.code); } catch (err) {}
        this.setState({ copied: true });
      },
      codeHref: s.saved && forSignup ? 'boards.html' : '#auth-form',
      codeDone: (e) => {
        if (!this.state.saved) {
          if (e && e.preventDefault) e.preventDefault();
          this.setState({ tried: true });
          return;
        }
        if (this.state.codeFor !== 'signup') {
          if (e && e.preventDefault) e.preventDefault();
          this.go('login');
        }
      },
      recover: () => {
        if (emailErr || codeErr || newPwErr || pw2Err) { this.setState({ tried: true }); return; }
        if (s.codeIn.trim() !== SIGNUP_CODE) { this.setState({ tried: true, recoverErr: true }); return; }
        this.go('code', { codeFor: 'recover', code: NEXT_CODE, codeIn: '' });
      },
      toLogin: () => this.go('login', { expired: false }),
      toSignup: () => this.go('signup', { expired: false }),
      toRecover: () => this.go('recover', { expired: false, codeIn: '' })
    };
  }
}

const URL_START = {'error': '로그인 오류', 'signup': '회원가입', 'code': '복구 코드', 'recover': '비밀번호 재설정', 'expired': '로그인 만료'};
const key = new URLSearchParams(location.search).get('state');
render(html`<${Page} start=${URL_START[key] || '로그인'} />`, document.getElementById('app'));
</script>
</body>
</html>
