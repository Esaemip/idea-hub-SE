<div id="app"></div>
<script>
/* 아이디어 허브 · 화면 시안 (feature/board-ui). 화면 구조는 render() 안의 템플릿, 동작은 Page 클래스에 있어요. */
const { html, render, Component } = window.htmPreact;

class DCLogic extends Component {
  componentDidMount() { this.flushFocus(); }
  componentDidUpdate() { this.flushFocus(); }
  flushFocus() {
    const go = this.pendingFocus;
    this.pendingFocus = null;
    if (go) go();
  }
  render() {
    const V = this.renderVals();
    return html`<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FAFAF7; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; color: #111118; font-size: 14px">

  <aside aria-label="메뉴" style="flex: 1 1 248px; box-sizing: border-box; padding: 14px 10px 12px; background: #F7F7F8; border-right: 1px solid #ECECEF; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 6px 14px">
      <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#111118"></rect><g stroke="#55586A" stroke-width="1.3" stroke-linecap="round"><line x1="14" y1="14" x2="14" y2="5.5"></line><line x1="14" y1="14" x2="22.1" y2="11.4"></line><line x1="14" y1="14" x2="19" y2="20.9"></line><line x1="14" y1="14" x2="9" y2="20.9"></line><line x1="14" y1="14" x2="5.9" y2="11.4"></line></g><circle cx="14" cy="5.5" r="2.3" fill="#5B8DF5"></circle><circle cx="22.1" cy="11.4" r="2.3" fill="#F28A45"></circle><circle cx="19" cy="20.9" r="2.3" fill="#A974E8"></circle><circle cx="9" cy="20.9" r="2.3" fill="#2DB88A"></circle><circle cx="5.9" cy="11.4" r="2.3" fill="#E9608F"></circle><circle cx="14" cy="14" r="3.3" fill="#FFFFFF"></circle></svg>
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.2px">Idea hub</span>
    </div>
    <nav aria-label="보드 메뉴" style="display: flex; flex-direction: column; gap: 2px">
      <a href="boards.html?state=new" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; color: #111118; text-decoration: none; font-size: 14px; font-weight: 600">

const RED = '#C4314B';
const LINE = '#DCDCE2';
const NEW_CODE = 'P2VJ-6TYK-1MCS';
function field(msg) {
  return { msg: msg, has: !!msg, bd: msg ? RED : LINE, inv: msg ? 'true' : 'false' };
}
function pwChecks(pw) {
  return [
    { label: '8자 이상', ok: pw.length >= 8 },
    { label: '영문 포함', ok: /[A-Za-z]/.test(pw) },
    { label: '숫자 포함', ok: /[0-9]/.test(pw) }
  ];
}
class Page extends DCLogic {
  constructor(props) {
    super(props);
    const del = props.start === '탈퇴 확인';

      name: '이재환', savedName: '이재환', nameTried: false,
      cur: '', next: '', next2: '', pwTried: false,
      regen: 'idle', regenPw: '', regenTried: false, copied: false,
      delOpen: del, delPw: '', delTried: false,
      toast: ''
    };
    this.toastTimer = null;
    this.delFocused = false;
  }
  componentWillUnmount() {
    if (this.toastTimer) clearTimeout(this.toastTimer);
  }
  say(text) {
    if (this.toastTimer) clearTimeout(this.toastTimer);
    this.setState({ toast: text });
    this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2600);
  }
  renderVals() {
    const s = this.state;
    const nameErr = s.name.trim() ? '' : '이름을 적어 주세요.';
    const checks = pwChecks(s.next);
    const pwOk = checks.every((c) => c.ok);
    const curErr = s.cur ? '' : '지금 비밀번호를 적어 주세요.';
    const nextErr = !s.next ? '새 비밀번호를 적어 주세요.' : !pwOk ? '위 조건을 모두 채워 주세요.' : s.next === s.cur ? '지금 비밀번호와 다르게 정해 주세요.' : '';
    const next2Err = !s.next2 ? '새 비밀번호를 한 번 더 적어 주세요.' : s.next2 !== s.next ? '비밀번호가 서로 달라요.' : '';
    const regenErr = s.regenPw ? '' : '비밀번호를 적어 주세요.';
    const delErr = s.delPw ? '' : '비밀번호를 적어야 탈퇴할 수 있어요.';
    const showPw = (m) => (s.pwTried ? m : '');
    return {
      name: s.name,
      savedName: s.savedName,
      setName: (e) => this.setState({ name: e.target.value }),
      nm: field(s.nameTried ? nameErr : ''),
      nameSame: s.name.trim() === s.savedName,
      nameOp: s.name.trim() === s.savedName ? 0.4 : 1,
      saveName: () => {
        if (nameErr) { this.setState({ nameTried: true }); return; }
        this.setState({ savedName: this.state.name.trim(), name: this.state.name.trim(), nameTried: false });
        this.say('이름을 바꿨어요');
      },
      pw: { cur: s.cur, next: s.next, next2: s.next2 },
      setCur: (e) => this.setState({ cur: e.target.value }),
      setNext: (e) => this.setState({ next: e.target.value }),
      setNext2: (e) => this.setState({ next2: e.target.value }),
      pc: field(showPw(curErr)),
      pn: field(showPw(nextErr)),
      pn2: field(showPw(next2Err)),
      checks: checks.map((c) => ({ label: c.label, ok: c.ok, no: !c.ok, color: c.ok ? '#0E7A55' : '#6B6E79', fw: c.ok ? 700 : 500 })),
      changePw: () => {
        if (curErr || nextErr || next2Err) { this.setState({ pwTried: true }); return; }
        this.setState({ cur: '', next: '', next2: '', pwTried: false });
        this.say('비밀번호를 바꿨어요');
      },
      regenIdle: s.regen === 'idle',
      regenConfirm: s.regen === 'confirm',
      regenDone: s.regen === 'done',
      startRegen: () => this.setState({ regen: 'confirm', regenPw: '', regenTried: false }),
      cancelRegen: () => this.setState({ regen: 'idle', regenPw: '', regenTried: false }),
      regenPw: s.regenPw,
      setRegenPw: (e) => this.setState({ regenPw: e.target.value }),
      rg: field(s.regenTried ? regenErr : ''),
      doRegen: () => {
        if (regenErr) { this.setState({ regenTried: true }); return; }
        this.setState({ regen: 'done', regenPw: '', copied: false });
      },
      newCode: NEW_CODE,
      copyLabel: s.copied ? '복사했어요' : '복사',
      copyCode: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText(NEW_CODE); } catch (err) {}
        this.setState({ copied: true });
      },
      delOpen: s.delOpen,
      openDelete: () => { this.delFocused = false; this.setState({ delOpen: true, delPw: '', delTried: false }); },
      closeDelete: () => this.setState({ delOpen: false }),
      dialogKey: (e) => { if (e.key === 'Escape') { e.preventDefault(); this.setState({ delOpen: false }); } },
      delRef: (el) => { if (el && !this.delFocused) { this.delFocused = true; el.focus(); } },
      delPw: s.delPw,
      setDelPw: (e) => this.setState({ delPw: e.target.value }),
      dp: field(s.delTried ? delErr : ''),
      delHref: delErr ? '#del-pw' : 'login.html',
      doDelete: (e) => {
        if (delErr) {
          if (e && e.preventDefault) e.preventDefault();
          this.setState({ delTried: true });
        }
      },
      toastShow: !!s.toast,
      toastText: s.toast
    };
  }
}

const URL_START = {'delete': '탈퇴 확인'};
const key = new URLSearchParams(location.search).get('state');
render(html`<${Page} start=${URL_START[key] || '계정 설정'} />`, document.getElementById('app'));
</script>
</body>
</html>
