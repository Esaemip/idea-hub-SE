name: 기본 확인

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python 문법 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python 파일 문법 검사
        run: python -m compileall -q backend ai
      - name: 백엔드 의존성 설치
        run: python -m pip install -r backend/requirements.txt
      - name: DB 및 API 테스트
        run: python -m unittest discover -s backend/tests -v
      - name: 분석 서비스와 그룹화 테스트
        run: |
          python -m unittest discover -s tests -v
          python -m unittest ai.test_grouping -v
